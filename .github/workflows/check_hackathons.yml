name: Check Hackathons Milano

on:
  schedule:
    # 11:00 UTC = 12:00 CET (inverno) / 13:00 CEST (estate)
    # GitHub Actions non gestisce il DST — offset di 1h in estate
    - cron: '0 11 * * *'
  workflow_dispatch: # Lancio manuale dalla tab Actions → "Run workflow"

concurrency:
  group: hackathon-monitor
  cancel-in-progress: false   # Aspetta il run corrente invece di cancellarlo

permissions:
  contents: write  # Necessario per auto-commit

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Check AI classifier secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::warning::GROQ_API_KEY is not configured; scheduled scans will preserve existing events and mark the site as 'LLM non attivo'."
          fi

      - name: Run Hackathon Monitor
        env:
          EVENTBRITE_API_KEY: ${{ secrets.EVENTBRITE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEETUP_API_KEY: ${{ secrets.MEETUP_API_KEY }}
        run: python main.py

      - name: Pre-render static site (SSG)
        run: python scripts/build_static_site.py

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hackathon-monitor-report
          path: data/last_report.json
          if-no-files-found: ignore

      - name: Commit updated data and page
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: update events + page + readme"
          file_pattern: data/events.json data/review_queue.json data/review_decisions.json docs/index.html docs/review.html docs/assets/* README.md
